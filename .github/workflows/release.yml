name: Package artifacts

on:
  push:
    tags:
      - "py-v*"
      - "web-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build Python artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/py-v')
        run: |
          python -m pip install build
          python -m build python --outdir dist/python
      - name: Build web archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/web-v')
        run: |
          mkdir -p dist/web
          npm run check --workspace web
          npm pack --workspace web --pack-destination dist/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: access-kit-packages
          path: dist/
          if-no-files-found: error
