name: Package artifacts

on:
  push:
    tags:
      - "py-v*"
      - "web-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build Python artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/py-v')
        run: |
          python -m pip install build
          python -m build python --outdir dist/python
      - name: Build web archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/web-v')
        run: |
          mkdir -p dist/web
          npm run check --workspace web
          npm pack --workspace web --pack-destination dist/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: access-kit-packages
          path: dist/
          if-no-files-found: error
