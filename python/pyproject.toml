[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "access-kit"
version = "0.1.0.dev0"
description = "Shared backend toolkit for ClearRead and SoundSight"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nihar Gavva" }]
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2.7,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.28,<1",
  "mypy>=1.14",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "ruff>=0.9",
  "tox>=4.24",
  "pre-commit>=4",
]

[project.urls]
Repository = "https://github.com/gavvahar/access-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/access_kit"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]
