[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "access-kit"
version = "1.0.0"
description = "Shared backend toolkit for ClearRead and SoundSight"
keywords = ["accessibility", "fastapi", "ssrf", "redis"]
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nihar Gavva" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "pydantic>=2.9,<3",
  "httpx>=0.28,<1",
  "redis>=5,<9",
]

[project.optional-dependencies]
testing = ["fakeredis[lua]>=2.26", "pytest>=8", "pytest-asyncio>=0.25"]
dev = [
  "build>=1.2",
  "fakeredis[lua]>=2.26",
  "httpx>=0.28,<1",
  "mypy>=1.14",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "ruff>=0.9",
  "tox>=4.24",
  "pre-commit>=4",
]

[project.urls]
Documentation = "https://github.com/gavvahar/access-kit/blob/main/docs/api.md"
Issues = "https://github.com/gavvahar/access-kit/issues"
Repository = "https://github.com/gavvahar/access-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/access_kit"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]
